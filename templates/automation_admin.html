{% extends 'base.html' %}{% block content %}<h1>Fulfillment queue</h1><table><tr><th>Event</th><th>Customer</th><th>Product</th><th>Status</th><th>Action</th></tr>{% for e in events %}<tr><td>{{e.id}}</td><td>{{e.email}}</td><td>{{e.product}}</td><td>{{e.status}}{% if e.last_error %}<small>{{e.last_error}}</small>{% endif %}</td><td>{% if e.status != 'sent' %}<form method="post"><input type="hidden" name="id" value="{{e.id}}"><button>Send email</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
